<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Sitesi Kaldırıldı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fafafa;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px 30px;
            background: #ffffff;
            border-top: 5px solid #2c3e50;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 90%;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 15px;
            color: #95a5a6;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 15px 0;
            font-weight: 600;
        }
        p {
            font-size: 15px;
            color: #7f8c8d;
            line-height: 1.6;
            margin: 0;
        }
        .divider {
            height: 1px;
            background-color: #eee;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚫</div>
        <h1>Web Sitesi Kaldırıldı</h1>
        <p>Bu web sitesi kalıcı olarak yayından kaldırılmıştır ve artık erişilebilir değildir.</p>
        <div class="divider"></div>
        <p><small style="color: #bdc3c7;">Gösterdiğiniz ilgi için teşekkür ederiz.</small></p>
    </div>

</body>
</html>
